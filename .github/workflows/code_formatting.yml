name: Code Formatting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-formatting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-formatting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            manager/pyproject.toml
            manager/uv.lock
            runner/pyproject.toml
            runner/uv.lock
          cache-suffix: format-py311

      - name: Show uv version
        run: uv --version

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install manager dev dependencies
        working-directory: manager
        run: uv sync --locked --extra dev

      - name: Install runner dev dependencies
        working-directory: runner
        run: uv sync --locked --extra dev

      - name: Check manager Python formatting (black + isort)
        working-directory: manager
        run: make fmt-check

      - name: Check runner Python formatting (black + isort)
        working-directory: runner
        run: make fmt-check

      - name: Check manager web formatting (Prettier)
        run: |
          npx --yes prettier@3.6.2 --check \
            manager/app/web/static/*.js \
            manager/app/web/static/*.css
