# MediaMTX 1.21.1. Shared by the Live instances of one Runner deployment.
# Paths are created and deleted with the local Control API, never YAML edits.
logLevel: info
logStructured: false
rtsp: false
rtmp: true
rtmpAddress: 127.0.0.1:2935
hls: false
webrtc: false
srt: false
moq: false
api: true
apiAddress: 127.0.0.1:10997
metrics: true
metricsAddress: 127.0.0.1:10998
authInternalUsers:
  - user: transcoder
    pass: CHANGE_ME_READ_PASSWORD
    ips: []
    permissions:
      - action: read
        path: "~^live/[a-f0-9-]+$"
  - user: control
    pass: CHANGE_ME_CONTROL_PASSWORD
    ips: []
    permissions:
      - action: api
      - action: metrics
paths: {}
