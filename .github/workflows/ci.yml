name: CI

# CI runs on push/PR to main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Minimal default permissions for the whole workflow.
permissions:
  contents: read

jobs:
  # Run the full quality matrix for both Python projects.
  tests:
    name: pytest (${{ matrix.project }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [ manager, runner ]
        python-version: [ "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: ${{ matrix.project }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          cache-suffix: ${{ matrix.project }}-py${{ matrix.python-version }}

      - name: Show uv version
        run: uv --version

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: |
          uv sync --locked --extra dev

      - name: Format check (black + isort)
        working-directory: ${{ matrix.project }}
        run: |
          make fmt-check

      - name: Lint (flake8 + mypy)
        working-directory: ${{ matrix.project }}
        run: |
          make lint

      - name: Build and smoke-test wheel
        working-directory: ${{ matrix.project }}
        env:
          WHEEL_DIR: ${{ runner.temp }}/wheel-${{ matrix.project }}-py${{ matrix.python-version }}
          WHEEL_VENV: ${{ runner.temp }}/wheel-venv-${{ matrix.project }}-py${{ matrix.python-version }}
          LOG_DIR: ${{ runner.temp }}/logs-${{ matrix.project }}-py${{ matrix.python-version }}
          RUNNER_TOKEN: wheel-smoke-token
        run: |
          uv build --wheel --out-dir "${WHEEL_DIR}"
          uv venv "${WHEEL_VENV}"
          uv pip install --python "${WHEEL_VENV}/bin/python" "${WHEEL_DIR}"/*.whl
          cd "${RUNNER_TEMP}"
          "${WHEEL_VENV}/bin/python" -c "import app.main; print(app.main.app.title)"

      - name: Tests with coverage
        working-directory: ${{ matrix.project }}
        run: |
          make coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-${{ matrix.project }}-py${{ matrix.python-version }}
          path: ${{ matrix.project }}/htmlcov/
          retention-days: 14

  # Branch protection can target this single job instead of the whole matrix.
  required:
    name: required
    runs-on: ubuntu-latest
    needs:
      - tests
    steps:
      - run: echo "All matrix jobs passed."
